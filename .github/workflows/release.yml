name: Release Automation

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m venv .venv313
          .venv313/bin/python -m pip install pyinstaller -r requirements.txt

      - name: Build, package, and verify Stay Woke
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="dev-${GITHUB_RUN_ID}"
          fi

          bash build.sh "$version"
          archive="staywoke-v${version}-${TARGET_ARCH}.tar.gz"
          mv "dist/staywoke-v${version}.tar.gz" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

          unpacked="$(mktemp -d)"
          tar -xzf "$archive" -C "$unpacked"
          test "$(lipo -archs "$unpacked/staywoke")" = "$TARGET_ARCH"
          test ! -e "$unpacked/6ix9ine"
          test ! -e "$unpacked/t69"
          "$unpacked/staywoke" --version | grep -F "Stay Woke v$version"
          "$unpacked/staywoke" dashboard --help | grep -F "usage: staywoke dashboard"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: staywoke-v*-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
